name: Hardening

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  miri-seeds:
    name: Miri allocation and thread interleavings
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIRI_BORROW_MODEL: tree-borrows
      MIRI_STRICT_PROVENANCE: "1"
      MIRI_PROFILE: release
      MIRI_FEATURES: std,secure,guarded
      MIRI_SEEDS: 0..8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust with Miri
        run: |
          rustup toolchain install "$(cat scripts/miri-toolchain)" --component miri --component rust-src --profile minimal
          cargo +"$(cat scripts/miri-toolchain)" miri setup
      - name: Check multiple allocation layouts and thread schedules
        run: bash scripts/check-miri.sh

  allocator-fuzz:
    name: Allocator transition fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run real allocator fuzz target
        run: REQUIRE_REAL_FUZZ=1 scripts/check-fuzz-smoke.sh

  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust with rust-src
        run: rustup toolchain install nightly --component rust-src
      - name: Run ASan test sweep
        run: SANITIZER_TOOLCHAIN=nightly scripts/check-sanitizers.sh

  valgrind-tracking:
    name: Valgrind tracking parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Run Valgrind tracking parity
        run: scripts/check-valgrind-tracking-parity.py
