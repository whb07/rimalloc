[package]
name = "rimalloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Mechanical Rust translation foundation for mimalloc 3.3.2"
license = "MIT"
repository = "https://github.com/whb07/rimalloc"
readme = "README.md"
documentation = "https://docs.rs/rimalloc"
keywords = ["allocator", "mimalloc", "ffi", "no-std"]
categories = ["memory-management", "external-ffi-bindings"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/rust-toolchain.toml",
  "/rustfmt.toml",
  "/clippy.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/benches/**",
  "/benchmarks/**",
  "/docs/**",
  "/build.rs",
  "/PARITY.md",
  "/BENCHMARK_RESULTS.md",
  "/UPSTREAM_DIFF.md",
  "/TYPES_SPEC.md",
]

[lib]
crate-type = ["rlib"]

[features]
# Default features are intentionally empty so Linux cdylib builds can stay
# `no_std` unless tooling explicitly opts into `std`.
default = []
# Enable Valgrind tracking shims. When enabled together with `track-asan`
# through aggregate tooling builds, Valgrind mode takes precedence.
track-valgrind = []
# Enable ASan tracking shims.
track-asan = []
# Enable secure-mode padding and encoded free lists.
secure = []
# Enable guarded allocation sampling.
guarded = []
# Opt into `std` for tests, docs, examples, and tooling builds.
std = []
# Enable Criterion benchmark targets.
bench = ["std"]
# Enable comparison-oriented benchmark/test code.
compare = []
# Enable benchmark-only hotspot counters. This is intended for local profiling
# builds and is compiled out unless explicitly requested.
bench-diagnostics = ["std"]
# Expose Rust macro translations of mimalloc C header convenience macros.
# These are raw Tier R compatibility helpers, not the default safe Rust API.
c-header-macros = []
# Enable build-script setup for C ABI artifacts. Cargo crate types are selected
# by the build command; use `cargo rustc --features interpose --lib --crate-type cdylib`
# for the malloc-interposing shared library.
c-abi = []
# Compile and link the C++ operator new/delete override shim.
cxx-overrides = ["c-abi"]
# Compile and link the Linux initial-exec TLS shim.
tls-shim = ["c-abi"]
# Restore the full C ABI/interposition artifact build mode.
interpose = ["c-abi", "cxx-overrides", "tls-shim"]
[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mi_sanitizer_runtime)", "cfg(miri)"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_safety_doc = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
borrow_as_ptr = "allow"
bool_to_int_with_if = "allow"
branches_sharing_code = "allow"
checked_conversions = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_ptr_alignment = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
elidable_lifetime_names = "allow"
explicit_iter_loop = "allow"
if_not_else = "allow"
inline_always = "allow"
iter_with_drain = "allow"
items_after_statements = "allow"
large_stack_arrays = "allow"
literal_string_with_formatting_args = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wild_err_arm = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_const_for_fn = "allow"
must_use_candidate = "allow"
needless_continue = "allow"
needless_raw_string_hashes = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
option_if_let_else = "allow"
option_option = "allow"
ptr_as_ptr = "allow"
ptr_cast_constness = "allow"
pub_underscore_fields = "allow"
redundant_closure_for_method_calls = "allow"
redundant_pub_crate = "allow"
ref_as_ptr = "allow"
semicolon_if_nothing_returned = "allow"
single_match_else = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
suboptimal_flops = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unreadable_literal = "allow"
unnecessary_semicolon = "allow"
uninlined_format_args = "allow"
use_self = "allow"
used_underscore_binding = "allow"
used_underscore_items = "allow"
while_float = "allow"
wildcard_imports = "allow"
useless_let_if_seq = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1

[dependencies]

[dev-dependencies]
criterion = "0.5"
libc = "0.2"
loom = "0.7.2"
rand = "0.8"
static_assertions = "1"

[[bench]]
name = "workloads"
path = "benches/workloads.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "hotpath"
path = "benches/hotpath.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "mimalloc_bench"
path = "benches/mimalloc_bench.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "evidence"
path = "benches/evidence.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "page_batch"
path = "benches/page_batch.rs"
harness = false
required-features = ["bench", "bench-diagnostics"]

[[bench]]
name = "memcpy"
path = "benches/memcpy.rs"
harness = false
required-features = ["bench"]

[[example]]
name = "aligned"
path = "examples/aligned.rs"
required-features = ["std"]

[[example]]
name = "allocation"
path = "examples/allocation.rs"
required-features = ["std"]

[[example]]
name = "ffi"
path = "examples/ffi.rs"
required-features = ["std"]

[[example]]
name = "evidence_report"
path = "examples/evidence_report.rs"
required-features = ["std", "bench-diagnostics"]

[[example]]
name = "benchmark_probe"
path = "examples/benchmark_probe.rs"
required-features = ["std"]

[[example]]
name = "global_allocator"
path = "examples/global_allocator.rs"
required-features = ["std"]

[[example]]
name = "raw_heap"
path = "examples/raw_heap.rs"
required-features = ["std"]

[[example]]
name = "raw_options"
path = "examples/raw_options.rs"
required-features = ["std"]

[[example]]
name = "raw_stats"
path = "examples/raw_stats.rs"
required-features = ["std"]

[[example]]
name = "safe_heap"
path = "examples/safe_heap.rs"
required-features = ["std"]

[[example]]
name = "safe_options"
path = "examples/safe_options.rs"
required-features = ["std"]

[[example]]
name = "safe_stats"
path = "examples/safe_stats.rs"
required-features = ["std"]
