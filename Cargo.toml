[package]
name = "mechanical_mimalloc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
track-valgrind = []
track-asan = []
secure = []
guarded = []
std = []
bench = ["std"]
compare = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1

[dependencies]

[dev-dependencies]
criterion = "0.5"
libc = "0.2"
rand = "0.8"

[[bench]]
name = "workloads"
path = "benches/workloads.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "hotpath"
path = "benches/hotpath.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "mimalloc_bench"
path = "benches/mimalloc_bench.rs"
harness = false
required-features = ["bench"]
