name: Validation

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: Linux x86_64 full validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Formatting
        run: scripts/check-fmt.sh
      - name: Test std surface
        run: cargo test --quiet --features std
      - name: Install cargo-hack
        run: cargo install cargo-hack --locked
      - name: Lints and feature matrix
        run: |
          scripts/check-lints.sh
          scripts/check-features.sh
      - name: ABI, layout, and boundaries
        run: |
          scripts/check-api-inventory.py
          scripts/check-safe-boundary.py
          scripts/check-layer-boundaries.py
          scripts/check-ffi-boundary.py
          scripts/check-raw-facade.sh
          scripts/check-layout.sh
          scripts/check-abi-symbols.sh
          scripts/check-strict-types.py
          scripts/check-policy-boundaries.py
      - name: Feature-sensitive ABI
        run: scripts/check-feature-abi.sh
      - name: Safety documentation
        run: |
          scripts/check-safe-docs.py
      - name: No-default builds
        run: |
          cargo check --no-default-features
          cargo build --release --no-default-features
      - name: Rust facade and C ABI artifact modes
        run: |
          cargo check --features std
          cargo rustc --features interpose --lib --release -- --crate-type cdylib
      - name: Build release artifacts for C/C++ consumers
        run: scripts/build-release-artifacts.py
      - name: C consumers for c-abi and interpose static/dynamic artifacts
        env:
          MECHANICAL_MIMALLOC_REUSE_RELEASE_ARTIFACTS: "1"
        run: scripts/check-release-artifact-consumer.py
      - name: dlopen consumer for c-abi dynamic artifact
        env:
          MECHANICAL_MIMALLOC_REUSE_RELEASE_ARTIFACTS: "1"
        run: scripts/check-release-dlopen.py
      - name: LD_PRELOAD consumer for interpose dynamic artifact
        env:
          MECHANICAL_MIMALLOC_REUSE_RELEASE_ARTIFACTS: "1"
        run: scripts/check-release-ld-preload.py
      - name: C++ consumers for interpose static/dynamic override artifacts
        env:
          MECHANICAL_MIMALLOC_REUSE_RELEASE_ARTIFACTS: "1"
        run: scripts/check-release-cxx-artifacts.py
      - name: Release thread stress and free-only consumers
        run: scripts/check-release-thread-stress.py
      - name: Build-tool diagnostics
        run: scripts/check-build-tools.sh
      - name: Package smoke
        run: scripts/check-package.sh

  linux-aarch64:
    name: Linux aarch64 smoke validation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Core tests
        run: cargo test --quiet --features std
      - name: Layout matrix
        run: scripts/check-layout.sh
      - name: Release thread stress and free-only consumers
        run: scripts/check-release-thread-stress.py

  macos:
    name: macOS ARM64 allocator validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Verify native ARM64 host
        run: test "$(uname -m)" = arm64
      - name: Formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features
      - name: Default and all-feature tests
        run: |
          cargo test --no-default-features
          cargo test --workspace --all-targets --all-features
      - name: Optimized allocator tests
        run: cargo test --release --features std --lib --tests
      - name: Optimized tests with the promoted malloc zone
        run: cargo test --release --features std,interpose --lib --tests
      - name: DYLD interposition with native C and C++ consumers
        run: scripts/check-macos-interpose.py
      - name: C header layout parity
        run: scripts/check-layout.sh
      - name: Install nightly for native sanitizers
        run: rustup toolchain install nightly --component rust-src
      - name: Native AddressSanitizer
        env:
          SANITIZER: address
          SANITIZER_TARGET: aarch64-apple-darwin
        run: scripts/check-sanitizers.sh
      - name: Native ThreadSanitizer
        env:
          SANITIZER: thread
          SANITIZER_TARGET: aarch64-apple-darwin
        run: scripts/check-sanitizers.sh

  windows:
    name: Windows smoke validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Windows allocator tests
        run: cargo test --quiet --features std

  safety-stress:
    name: Safety and stress tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Stress, fuzz, oversize, alignment, and zero-size coverage
        run: scripts/check-safety-stress.sh

  miri:
    name: Miri core unsafe validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust with Miri
        run: rustup toolchain install nightly --component miri --component rust-src
      - name: Run Miri stacked, tree-borrows, strict, and strict tree-borrows checks
        run: bash scripts/check-miri-all.sh

  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust with rust-src
        run: rustup toolchain install nightly --component rust-src
      - name: ASan representative tests
        run: SANITIZER=address SANITIZER_TOOLCHAIN=nightly scripts/check-sanitizers.sh

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust with rust-src
        run: rustup toolchain install nightly --component rust-src
      - name: TSan concurrency tests
        run: SANITIZER=thread SANITIZER_TOOLCHAIN=nightly scripts/check-sanitizers.sh

  valgrind:
    name: Valgrind tracking parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Valgrind tracking parity
        run: scripts/check-valgrind-tracking-parity.py
