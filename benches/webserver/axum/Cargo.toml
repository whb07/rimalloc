# TechEmpower FrameworkBenchmarks axum test (frameworks/Rust/axum, revision 57d92fbe),
# trimmed to the json, plaintext, and fortunes tests. Fortunes reads SQLite instead of
# Postgres, and the server uses the system allocator so the benchmark runner can inject the
# allocator under test with LD_PRELOAD. See README.md.
[package]
name = "axum-techempower"
version = "0.3.0"
authors = ["Dragos Varovici <dvarovici.work@gmail.com>"]
edition = "2024"
publish = false

# Standalone: not a member of the allocator crate's build.
[workspace]

[[bin]]
name = "axum"
path = "src/main.rs"

[[bin]]
name = "axum-sqlite"
path = "src/main_sqlite.rs"

[dependencies]
axum = { version = "0.8.7", default-features = false, features = [
    "json",
    "query",
    "http1",
    "tokio",
] }
dotenv = "0.15.0"
num_cpus = "1.17.0"
rand = { version = "0.9.2", features = ["small_rng"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.7", features = ["set-header"] }
yarte = "0.15.7"
socket2 = "0.6.1"
hyper = { version = "1.8.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
